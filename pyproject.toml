[project]
name = "comoros-malaria-climate"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "pmdarima>=2.0",
    "prophet>=1.1.5",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]
